#Configuration
VERBOSE: False  # 是否输出详细日志
MODEL:
  NAME: 'BaseModelTest01'  # model name

#Optimization arguments
TRAINOPTIM:
  BATCH: 2
  EPOCHS: 200
  LR_INITIAL: 1e-4
  LR_MIN: 1e-7
  WARMUP_EPOCHS: 3

TRAINING:
  VAL_AFTER_EVERY: 1
  RESUME: false # 在base model上训练
  TRAIN_PS: 256
  VAL_PS: 256
  TRAIN_DIR: '/mnt/zjy/DataSet/FlareDataSet/FlareDataSet4/train'       # path to training data
  VAL_DIR: '/mnt/zjy/DataSet/flare_synthetic_test'
  SAVE_DIR: './checkpoints'           # path to save models and images
  LOG_DIR: './train_logs'
  TRAIN_RESULT: './training_data/result'
  TRAIN_HEATMAP: './training_data/heatmap'
  TRAIN_MASK: './training_data/mask'

TESTING:
  TEST_PS: None
  TEST_DIR: '/data/zjy/datasets/flare_real_test' # path to validation data
  TEST_DIR_SYN: '/data/zjy/datasets/flare_synthetic_test' # path to validation data
  WEIGHT_ROOT: './checkpoints/MFD/models'
  WEIGHT_NAME: '/model_bestPSNR.pth'

